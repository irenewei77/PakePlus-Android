        let calendarCurrentYear = new Date().getFullYear();
        let calendarCurrentMonth = new Date().getMonth();

        function renderCalendar(year, month) {
            const container = document.getElementById('calendarDays');
            const monthYearEl = document.getElementById('calMonthYear');
            monthYearEl.textContent = `${year}年${month+1}月`;

            const recordDates = getRecordDates();
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDayOfWeek = firstDay.getDay();
            const todayStr = getToday();
            const selectedDate = currentFilterDate || '';

            let html = '';
            for (let i = 0; i < startDayOfWeek; i++) {
                html += `<div class="calendar-day other-month"></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = dateStr === todayStr;
                const isSelected = dateStr === selectedDate;
                const hasRecord = recordDates.has(dateStr);

                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                if (hasRecord) classes += ' has-record';

                html += `
                    <button class="${classes}" data-date="${dateStr}">
                        ${d}
                        <span class="cal-dot"></span>
                    </button>
                `;
            }
            container.innerHTML = html;

            container.querySelectorAll('.calendar-day[data-date]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const date = btn.dataset.date;
                    currentFilterDate = date;
                    updateAll();
                    closeCalendar();
                    showToast(`📅 ${formatDateDisplay(date)}`);
                });
            });
        }

        function openCalendar() {
            document.getElementById('calendarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            if (currentFilterDate) {
                const parts = currentFilterDate.split('-');
                calendarCurrentYear = parseInt(parts[0]);
                calendarCurrentMonth = parseInt(parts[1]) - 1;
            } else {
                const today = new Date();
                calendarCurrentYear = today.getFullYear();
                calendarCurrentMonth = today.getMonth();
            }
            renderCalendar(calendarCurrentYear, calendarCurrentMonth);
        }

        function closeCalendar() {
            document.getElementById('calendarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('calPrevMonth').addEventListener('click', () => {
            calendarCurrentMonth--;
            if (calendarCurrentMonth < 0) { calendarCurrentMonth = 11;
                calendarCurrentYear--; }
            renderCalendar(calendarCurrentYear, calendarCurrentMonth);
        });
        document.getElementById('calNextMonth').addEventListener('click', () => {
            calendarCurrentMonth++;
            if (calendarCurrentMonth > 11) { calendarCurrentMonth = 0;
                calendarCurrentYear++; }
            renderCalendar(calendarCurrentYear, calendarCurrentMonth);
        });
        document.getElementById('calToday').addEventListener('click', () => {
            const today = new Date();
            calendarCurrentYear = today.getFullYear();
            calendarCurrentMonth = today.getMonth();
            renderCalendar(calendarCurrentYear, calendarCurrentMonth);
        });
        document.getElementById('calendarClose').addEventListener('click', closeCalendar);
        document.getElementById('calendarOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeCalendar();
        });

        // ---- 年份选择器 ----
        const yearPickerOverlay = document.getElementById('yearPickerOverlay');
        const yearGrid = document.getElementById('yearGrid');
        const yearPickerClose = document.getElementById('yearPickerClose');

        function openYearPicker() {
            const currentYear = calendarCurrentYear;
            yearGrid.innerHTML = '';
            const startYear = currentYear - 10;
            const endYear = currentYear + 10;
            for (let y = startYear; y <= endYear; y++) {
                const btn = document.createElement('button');
                btn.className = 'year-btn' + (y === currentYear ? ' current' : '');
                btn.textContent = y;
                btn.addEventListener('click', () => {
                    calendarCurrentYear = y;
                    renderCalendar(calendarCurrentYear, calendarCurrentMonth);
                    closeYearPicker();
                });
                yearGrid.appendChild(btn);
            }
            yearPickerOverlay.classList.add('active');
        }

        function closeYearPicker() {
            yearPickerOverlay.classList.remove('active');
        }

        document.getElementById('calMonthYear').addEventListener('click', openYearPicker);
        yearPickerClose.addEventListener('click', closeYearPicker);
        yearPickerOverlay.addEventListener('click', (e) => {
            if (e.target === yearPickerOverlay) closeYearPicker();
        });

        // ============================================================
        //  9. 图片全屏预览（支持多图切换 + 触摸滑动）
        // ============================================================

        const previewOverlay = document.getElementById('imagePreviewOverlay');
        const previewImage = document.getElementById('previewImage');
        const previewClose = document.getElementById('previewClose');
        const previewPrev = document.getElementById('previewPrev');
        const previewNext = document.getElementById('previewNext');
        const previewCounter = document.getElementById('previewCounter');

        let previewImages = [];
        let previewIndex = 0;

        // --- 触摸滑动 ---
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        previewOverlay.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
        }, { passive: true });

        previewOverlay.addEventListener('touchmove', function(e) {
            if (previewImages.length <= 1) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            if (Math.abs(deltaX) > 20 && Math.abs(deltaX) > Math.abs(deltaY) * 0.8) {
                isSwiping = true;
            }
        }, { passive: true });

        previewOverlay.addEventListener('touchend', function(e) {
            if (!isSwiping || previewImages.length <= 1) return;
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const threshold = 50;
            if (deltaX < -threshold) {
                if (previewIndex < previewImages.length - 1) {
                    showPreviewImage(previewIndex + 1);
                }
            } else if (deltaX > threshold) {
                if (previewIndex > 0) {
                    showPreviewImage(previewIndex - 1);
                }
            }
            isSwiping = false;
        }, { passive: true });

        // 鼠标拖拽支持（PC 调试）
        let mouseDownX2 = 0,
            mouseDownY2 = 0,
            mouseIsSwiping = false;
        previewOverlay.addEventListener('mousedown', function(e) {
            if (e.target.closest('.preview-nav') || e.target.closest('.preview-close')) return;
            mouseDownX2 = e.clientX;
            mouseDownY2 = e.clientY;
            mouseIsSwiping = false;
            previewOverlay.style.cursor = 'grabbing';
        });
        previewOverlay.addEventListener('mousemove', function(e) {
            if (e.buttons === 0 || previewImages.length <= 1) return;
            const deltaX = e.clientX - mouseDownX2;
            const deltaY = e.clientY - mouseDownY2;
            if (Math.abs(deltaX) > 20 && Math.abs(deltaX) > Math.abs(deltaY) * 0.8) {
                mouseIsSwiping = true;
            }
        });
        previewOverlay.addEventListener('mouseup', function(e) {
            previewOverlay.style.cursor = 'pointer';
            if (!mouseIsSwiping || previewImages.length <= 1) return;
            const deltaX = e.clientX - mouseDownX2;
            if (deltaX < -50) {
                if (previewIndex < previewImages.length - 1) showPreviewImage(previewIndex + 1);
            } else if (deltaX > 50) {
                if (previewIndex > 0) showPreviewImage(previewIndex - 1);
            }
            mouseIsSwiping = false;
        });
        previewOverlay.addEventListener('mouseleave', function() {
            previewOverlay.style.cursor = 'pointer';
            mouseIsSwiping = false;
        });

        // --- 核心预览函数 ---
        function openImagePreview(src, allImages = [], index = 0) {
            const validAll = (allImages || []).filter(s => s && s.length > 100);
            if (validAll.length === 0) return;

            let idx = validAll.indexOf(src);
            if (idx === -1) idx = 0;
            previewImages = validAll;
            previewIndex = Math.min(Math.max(idx, 0), previewImages.length - 1);

            const showSrc = previewImages[previewIndex] || previewImages[0];
            previewImage.src = showSrc;
            previewOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updatePreviewNav();
            updatePreviewCounter();
        }

        function closeImagePreview() {
            previewOverlay.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { previewImage.src = ''; }, 300);
        }

        function updatePreviewNav() {
            const total = previewImages.length;
            previewPrev.classList.toggle('hidden', total <= 1 || previewIndex === 0);
            previewNext.classList.toggle('hidden', total <= 1 || previewIndex >= total - 1);
        }

        function updatePreviewCounter() {
            const total = previewImages.length;
            previewCounter.textContent = total > 1 ? `${previewIndex+1} / ${total}` : '';
        }

        function showPreviewImage(index) {
            if (index < 0 || index >= previewImages.length) return;
            previewIndex = index;
            previewImage.src = previewImages[previewIndex];
            updatePreviewNav();
            updatePreviewCounter();
        }

        previewPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            if (previewIndex > 0) showPreviewImage(previewIndex - 1);
        });
        previewNext.addEventListener('click', (e) => {
            e.stopPropagation();
            if (previewIndex < previewImages.length - 1) showPreviewImage(previewIndex + 1);
        });

        previewClose.addEventListener('click', closeImagePreview);
        previewOverlay.addEventListener('click', (e) => {
            if (e.target === previewOverlay) closeImagePreview();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && previewOverlay.classList.contains('active')) closeImagePreview();
            if (e.key === 'ArrowLeft' && previewOverlay.classList.contains('active')) {
                if (previewIndex > 0) showPreviewImage(previewIndex - 1);
            }
            if (e.key === 'ArrowRight' && previewOverlay.classList.contains('active')) {
                if (previewIndex < previewImages.length - 1) showPreviewImage(previewIndex + 1);
            }
        });

        // ============================================================
        //  10. 查看模态框 + PDF导出（修复：图片保持比例）
        // ============================================================

        let viewingRecordId = null;

        const viewModalOverlay = document.getElementById('viewModalOverlay');
        const viewContent = document.getElementById('viewContent');
        const viewModalClose = document.getElementById('viewModalClose');
        const viewCloseBtn = document.getElementById('viewCloseBtn');
        const viewEditBtn = document.getElementById('viewEditBtn');
        const viewPdfBtn = document.getElementById('viewPdfBtn');

        function openViewModal(recordId) {
            const record = getRecordById(recordId);
            if (!record) { showToast('记录不存在'); return; }

            viewingRecordId = recordId;
            const images = (record.images || []).filter(img => img && img.length > 100);
            const hasImages = images.length > 0;
            const mood = record.mood || '😊';
            const weather = record.weather || '☀️';
            const text = record.text || '';
            const date = record.date || '';
            const time = record.time || '';
            const displayDate = formatDateDisplay(date);
            const weekday = getWeekday(date);

            let html = '';

            if (hasImages) {
                html += createViewImagesGridHTML(images, 'view-images-grid', 'grid-item');
            } else {
                html += `
                    <div style="border-radius:var(--radius-sm); overflow:hidden; margin-bottom:16px; background:#f0ebe6; border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; height:120px; color:var(--text-light); font-size:40px;">
                        📝
                    </div>
                `;
            }

            html += `
                <div class="view-mood">
                    <span>${mood}</span>
                    <span class="view-mood-label">此刻的心情</span>
                </div>
                <div class="view-weather">
                    <span>${weather}</span>
                    <span class="view-weather-label">今天的天气</span>
                </div>
            `;

            if (text) {
                html += `<div class="view-text">${escapeHtml(text)}</div>`;
            } else {
                html += `<div class="view-text view-text-empty">（没有文字记录）</div>`;
            }

            html += `
                <div class="view-meta">
                    <span>📅 ${displayDate}</span>
                    <span class="view-time">${weekday}</span>
                    <span class="view-time">🕊 ${time}</span>
                </div>
            `;

            viewContent.innerHTML = html;
            viewModalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeViewModal() {
            viewModalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            viewingRecordId = null;
        }

        viewModalClose.addEventListener('click', closeViewModal);
        viewCloseBtn.addEventListener('click', closeViewModal);
        viewModalOverlay.addEventListener('click', (e) => {
            if (e.target === viewModalOverlay) closeViewModal();
        });

        viewEditBtn.addEventListener('click', () => {
            const id = viewingRecordId;
            if (id) {
                const record = getRecordById(id);
                if (record) {
                    closeViewModal();
                    setTimeout(() => openEditModal(id), 200);
                } else { showToast('记录已不存在');
                    closeViewModal(); }
            } else { showToast('没有选中的记录'); }
        });

        // ===== PDF导出（修复：图片保持原始比例，不再变形） =====
        viewPdfBtn.addEventListener('click', async function() {
            const id = viewingRecordId;
            if (!id) { showToast('没有选中的记录'); return; }
            const record = getRecordById(id);
            if (!record) { showToast('记录已不存在'); return; }

            try {
                showToast('⏳ 正在生成PDF...');

                const images = (record.images || []).filter(img => img && img.length > 100);
                const hasImages = images.length > 0;
                const mood = record.mood || '😊';
                const weather = record.weather || '☀️';
                const text = record.text || '';
                const date = record.date || '';
                const time = record.time || '';
                const displayDate = formatDateDisplay(date);
                const weekday = getWeekday(date);

                let imagesHtml = '';
                if (hasImages) {
                    const showImgs = images.slice(0, MAX_IMAGES);
                    const count = showImgs.length;
                    imagesHtml =
                        `<div class="pdf-images-grid count-${Math.min(count, MAX_IMAGES)}">`;
                    showImgs.forEach(src => {
                        // 内联样式确保图片保持比例，不受外部干扰
                        imagesHtml += `
                            <div class="pdf-grid-item">
                                <img src="${src}" alt="记录图片" style="max-width:100%; max-height:100%; width:auto; height:auto; display:block; object-fit:unset;" />
                            </div>
                        `;
                    });
                    imagesHtml += `</div>`;
                } else {
                    imagesHtml = `<div class="pdf-noimage">📝</div>`;
                }

                const exportHtml = `
                    <div class="pdf-export-wrap" id="pdfExportWrap">
                        ${imagesHtml}
                        <div class="pdf-icons">
                            <span>${mood}</span>
                            <span>${weather}</span>
                        </div>
                        ${text ? `<div class="pdf-text">${escapeHtml(text)}</div>` :
                                 `<div class="pdf-text pdf-text-empty">（没有文字记录）</div>`}
                        <div class="pdf-meta">
                            <span>📅 ${displayDate}</span>
                            <span>${weekday}</span>
                            <span>🕊 ${time}</span>
                        </div>
                    </div>
                `;

                const tempContainer = document.createElement('div');
                tempContainer.style.cssText =
                    'position:fixed; left:-9999px; top:0; width:500px; background:#fff; padding:20px; z-index:9999;';
                tempContainer.innerHTML = exportHtml;
                document.body.appendChild(tempContainer);

                // 等待所有图片加载完成
                const imgs = tempContainer.querySelectorAll('img');
                await Promise.all(Array.from(imgs).map(img =>
                    new Promise((resolve) => {
                        if (img.complete) resolve();
                        else { img.onload = resolve;
                            img.onerror = resolve; }
                        setTimeout(resolve, 4000);
                    })
                ));

                const targetEl = document.getElementById('pdfExportWrap');
                const canvas = await html2canvas(targetEl, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    width: 500,
                    height: targetEl.scrollHeight,
                });

                document.body.removeChild(tempContainer);

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 210;
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`i人日记_${date}_${time.replace(':','-')}.pdf`);

                showToast('✅ PDF已导出');
            } catch (err) {
                console.error(err);
                showToast('❌ PDF导出失败，请重试');
            }
        });

        // ============================================================
        //  11. 记录模态框（添加·多图）
        // ============================================================

        let selectedImages = [];
        let selectedMood = '😊';
        let selectedWeather = '☀️';

        const modalOverlay = document.getElementById('modalOverlay');
        const fabBtn = document.getElementById('fabBtn');
        const modalClose = document.getElementById('modalClose');
        const btnCancel = document.getElementById('btnCancel');
        const btnSave = document.getElementById('btnSave');
        const fileInput = document.getElementById('fileInput');
        const textInput = document.getElementById('textInput');
        const moodGrid = document.getElementById('moodGrid');
        const weatherGrid = document.getElementById('weatherGrid');
        const imageThumbnails = document.getElementById('imageThumbnails');
        const maxHint = document.getElementById('maxHint');
        const uploadHint = document.getElementById('uploadHint');

        function renderMoodSelector() {
            moodGrid.innerHTML = '';
            MOODS.forEach(mood => {
                const btn = document.createElement('button');
                btn.className = 'mood-btn';
                btn.dataset.mood = mood;
                btn.textContent = mood;
                if (mood === selectedMood) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMood = mood;
                });
                moodGrid.appendChild(btn);
            });
        }

        function renderWeatherSelector() {
            weatherGrid.innerHTML = '';
            WEATHERS.forEach(weather => {
                const btn = document.createElement('button');
                btn.className = 'weather-btn';
                btn.dataset.weather = weather;
                btn.textContent = weather;
                if (weather === selectedWeather) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedWeather = weather;
                });
                weatherGrid.appendChild(btn);
            });
        }

        function renderThumbnails(container, images, onRemove) {
            container.innerHTML = '';
            if (images.length === 0) {
                container.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; color:var(--text-light); font-size:13px; padding:12px 0;">还没有添加图片</div>`;
                return;
            }
            images.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                const img = document.createElement('img');
                img.src = src;
                img.alt = `图片 ${idx+1}`;
                item.appendChild(img);
                const removeBtn = document.createElement('button');
                removeBtn.className = 'thumb-remove';
                removeBtn.innerHTML = '✕';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onRemove(idx);
                });
                item.appendChild(removeBtn);
                const indexLabel = document.createElement('span');
                indexLabel.className = 'thumb-index';
                indexLabel.textContent = `${idx+1}`;
                item.appendChild(indexLabel);
                container.appendChild(item);
            });
            updateMaxHint();
        }

        function updateMaxHint() {
            const count = selectedImages.length;
            maxHint.textContent = count >= MAX_IMAGES ? `⚠️ 最多 ${MAX_IMAGES} 张，已满` : `已选 ${count} 张 · 还可添加 ${MAX_IMAGES - count} 张`;
            uploadHint.textContent = count >= MAX_IMAGES ? '已满' : `最多 ${MAX_IMAGES} 张`;
        }

        function openModal() {
            modalOverlay.classList.add('active');
            fabBtn.classList.add('open');
            selectedImages = [];
            selectedMood = '😊';
            selectedWeather = '☀️';
            textInput.value = '';
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
            const defaultMood = document.querySelector(`.mood-btn[data-mood="😊"]`);
            if (defaultMood) defaultMood.classList.add('active');
            const defaultWeather = document.querySelector(`.weather-btn[data-weather="☀️"]`);
            if (defaultWeather) defaultWeather.classList.add('active');
            renderThumbnails(imageThumbnails, selectedImages, (idx) => {
                selectedImages.splice(idx, 1);
                renderThumbnails(imageThumbnails, selectedImages, (i) => {
                    selectedImages.splice(i, 1);
                    renderThumbnails(imageThumbnails, selectedImages, (j) => {
                        selectedImages.splice(j, 1);
                        renderThumbnails(imageThumbnails, selectedImages, (k) => {
                            selectedImages.splice(k, 1);
                            renderThumbnails(imageThumbnails, selectedImages, (l) => {
                                selectedImages.splice(l, 1);
                                renderThumbnails(imageThumbnails, selectedImages, (m) => {
                                    selectedImages.splice(m, 1);
                                    renderThumbnails(imageThumbnails,
                                        selectedImages, (n) => {
                                            selectedImages.splice(n, 1);
                                            renderThumbnails(
                                                imageThumbnails,
                                                selectedImages, (o) => {
                                                    selectedImages.splice(
                                                        o, 1);
                                                    renderThumbnails(
                                                        imageThumbnails,
                                                        selectedImages,
                                                        () => {});
                                                });
                                        });
                                });
                            });
                        });
                    });
                });
            });
            document.body.style.overflow = 'hidden';
            setTimeout(() => textInput.focus(), 400);
            fileInput.value = '';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            fabBtn.classList.remove('open');
            document.body.style.overflow = '';
            fileInput.value = '';
        }

        document.getElementById('addImagesBtn').addEventListener('click', () => {
            if (selectedImages.length >= MAX_IMAGES) {
                showToast(`最多只能添加 ${MAX_IMAGES} 张图片`);
                return;
            }
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            const remaining = MAX_IMAGES - selectedImages.length;
            if (files.length > remaining) {
                showToast(`最多还能添加 ${remaining} 张`);
                return;
            }
            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`"${file.name}" 过大，跳过`);
                    continue;
                }
                try {
                    const compressed = await compressImage(file, 900, 0.7);
                    selectedImages.push(compressed);
                } catch (err) {
                    showToast(`处理 "${file.name}" 失败`);
                }
            }
            renderThumbnails(imageThumbnails, selectedImages, (idx) => {
                selectedImages.splice(idx, 1);
                renderThumbnails(imageThumbnails, selectedImages, () => {});
            });
            fileInput.value = '';
        });

        btnSave.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text && selectedImages.length === 0) {
                showToast('写点文字或添加图片吧 📝');
                return;
            }
            const result = addRecord(text, selectedImages, selectedMood, selectedWeather);
            if (result) {
                closeModal();
                renderRecords();
                renderNavigation();
                renderSlideCard();
                showToast('✨ 记录已保存');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        function handleClose() {
            if (textInput.value.trim() || selectedImages.length > 0) {
                if (confirm('放弃这条记录吗？')) closeModal();
            } else {
                closeModal();
            }
        }

        modalClose.addEventListener('click', handleClose);
        btnCancel.addEventListener('click', handleClose);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) handleClose();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) handleClose();
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && modalOverlay.classList.contains('active')) {
                e.preventDefault();
                btnSave.click();
            }
        });

        // ============================================================
        //  12. 编辑模态框（多图）
        // ============================================================

        let editingRecordId = null;
        let editSelectedImages = [];
        let editSelectedMood = '😊';
        let editSelectedWeather = '☀️';

        const editModalOverlay = document.getElementById('editModalOverlay');
        const editModalClose = document.getElementById('editModalClose');
        const editCancel = document.getElementById('editCancel');
        const editSave = document.getElementById('editSave');
        const editDeleteBtn = document.getElementById('editDeleteBtn');
        const editFileInput = document.getElementById('editFileInput');
        const editTextInput = document.getElementById('editTextInput');
        const editMoodGrid = document.getElementById('editMoodGrid');
        const editWeatherGrid = document.getElementById('editWeatherGrid');
        const editImageThumbnails = document.getElementById('editImageThumbnails');
        const editMaxHint = document.getElementById('editMaxHint');

        function renderEditMoodSelector() {
            editMoodGrid.innerHTML = '';
            MOODS.forEach(mood => {
                const btn = document.createElement('button');
                btn.className = 'mood-btn';
                btn.dataset.mood = mood;
                btn.textContent = mood;
                if (mood === editSelectedMood) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#editMoodGrid .mood-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    editSelectedMood = mood;
                });
                editMoodGrid.appendChild(btn);
            });
        }

        function renderEditWeatherSelector() {
            editWeatherGrid.innerHTML = '';
            WEATHERS.forEach(weather => {
                const btn = document.createElement('button');
                btn.className = 'weather-btn';
                btn.dataset.weather = weather;
                btn.textContent = weather;
                if (weather === editSelectedWeather) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#editWeatherGrid .weather-btn').forEach(b => b.classList.remove(
                    'active'));
                    btn.classList.add('active');
                    editSelectedWeather = weather;
                });
                editWeatherGrid.appendChild(btn);
            });
        }

        function renderEditThumbnails() {
            editImageThumbnails.innerHTML = '';
            if (editSelectedImages.length === 0) {
                editImageThumbnails.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; color:var(--text-light); font-size:13px; padding:12px 0;">还没有添加图片</div>`;
                editMaxHint.textContent = '点击「添加图片」上传';
                return;
            }
            editSelectedImages.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                const img = document.createElement('img');
                img.src = src;
                img.alt = `图片 ${idx+1}`;
                item.appendChild(img);
                const removeBtn = document.createElement('button');
                removeBtn.className = 'thumb-remove';
                removeBtn.innerHTML = '✕';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editSelectedImages.splice(idx, 1);
                    renderEditThumbnails();
                });
                item.appendChild(removeBtn);
                const indexLabel = document.createElement('span');
                indexLabel.className = 'thumb-index';
                indexLabel.textContent = `${idx+1}`;
                item.appendChild(indexLabel);
                editImageThumbnails.appendChild(item);
            });
            const count = editSelectedImages.length;
            editMaxHint.textContent = count >= MAX_IMAGES ? `⚠️ 最多 ${MAX_IMAGES} 张，已满` :
                `已选 ${count} 张 · 还可添加 ${MAX_IMAGES - count} 张`;
            document.getElementById('editUploadHint').textContent = count >= MAX_IMAGES ? '已满' : `最多 ${MAX_IMAGES} 张`;
        }

        function openEditModal(recordId) {
            const record = getRecordById(recordId);
            if (!record) { showToast('记录不存在'); return; }

            editingRecordId = recordId;
            editSelectedMood = record.mood || '😊';
            editSelectedWeather = record.weather || '☀️';
            editSelectedImages = (record.images || []).filter(img => img && img.length > 100);
            editTextInput.value = record.text || '';

            renderEditMoodSelector();
            renderEditWeatherSelector();
            renderEditThumbnails();

            editModalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => editTextInput.focus(), 400);
            editFileInput.value = '';
        }

        function closeEditModal() {
            editModalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            editingRecordId = null;
            editFileInput.value = '';
        }

        document.getElementById('editAddImagesBtn').addEventListener('click', () => {
            if (editSelectedImages.length >= MAX_IMAGES) {
                showToast(`最多只能添加 ${MAX_IMAGES} 张图片`);
                return;
            }
            editFileInput.click();
        });

        editFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            const remaining = MAX_IMAGES - editSelectedImages.length;
            if (files.length > remaining) {
                showToast(`最多还能添加 ${remaining} 张`);
                return;
            }
            for (const file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    showToast(`"${file.name}" 过大，跳过`);
                    continue;
                }
                try {
                    const compressed = await compressImage(file, 900, 0.7);
                    editSelectedImages.push(compressed);
                } catch (err) {
                    showToast(`处理 "${file.name}" 失败`);
                }
            }
            renderEditThumbnails();
            editFileInput.value = '';
        });

        editSave.addEventListener('click', () => {
            if (!editingRecordId) { showToast('错误：没有选中的记录'); return; }
            const text = editTextInput.value.trim();
            if (!text && editSelectedImages.length === 0) {
                showToast('文字或图片至少保留一项 📝');
                return;
            }
            const updated = updateRecord(editingRecordId, text, editSelectedImages, editSelectedMood, editSelectedWeather);
            if (updated) {
                closeEditModal();
                renderRecords();
                renderNavigation();
                renderSlideCard();
                showToast('✅ 记录已更新');
            } else {
                showToast('更新失败，请重试');
            }
        });

        editDeleteBtn.addEventListener('click', () => {
            if (!editingRecordId) return;
            if (confirm('确定要删除这条记录吗？此操作不可撤销！')) {
                deleteRecord(editingRecordId);
                closeEditModal();
                updateAll();
                showToast('已删除记录 🗑');
            }
        });

        function handleEditClose() {
            const text = editTextInput.value.trim();
            const record = editingRecordId ? getRecordById(editingRecordId) : null;
            const originalText = record ? (record.text || '') : '';
            const originalImages = record ? (record.images || []) : [];
            const hasChanged = (text !== originalText) ||
                (JSON.stringify(editSelectedImages) !== JSON.stringify(originalImages)) ||
                (editSelectedMood !== (record ? record.mood : '😊')) ||
                (editSelectedWeather !== (record ? record.weather : '☀️'));
            if (hasChanged) {
                if (confirm('有未保存的修改，确定要放弃吗？')) closeEditModal();
            } else {
                closeEditModal();
            }
        }

        editModalClose.addEventListener('click', handleEditClose);
        editCancel.addEventListener('click', handleEditClose);
        editModalOverlay.addEventListener('click', (e) => {
            if (e.target === editModalOverlay) handleEditClose();
        });

        // ============================================================
        //  13. 设置模态框
        // ============================================================

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsClose = document.getElementById('settingsClose');
        const settingsDone = document.getElementById('settingsDone');

        function openSettings() {
            renderSettingsUI();
            updateStorageInfo();
            settingsOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        settingsBtn.addEventListener('click', openSettings);
        settingsClose.addEventListener('click', closeSettings);
        settingsDone.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) closeSettings();
        });

        function renderSettingsUI() {
            const settings = loadSettings();

            const themeGrid = document.getElementById('themeGrid');
            themeGrid.innerHTML = '';
            THEMES.forEach(theme => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn';
                btn.dataset.theme = theme.id;
                if (theme.id === settings.theme && !settings.customBackground) btn.classList.add('active');
                btn.innerHTML =
                    `<span class="theme-dot" style="background:${theme.dot};"></span><span class="theme-name">${theme.name}</span>`;
                btn.addEventListener('click', () => {
                    applyTheme(theme.id);
                    showToast(`主题切换为 “${theme.name}”`);
                });
                themeGrid.appendChild(btn);
            });

            const fontContainer = document.getElementById('fontOptions');
            fontContainer.innerHTML = '';
            FONTS.forEach(font => {
                const btn = document.createElement('button');
                btn.className = 'font-btn';
                btn.dataset.font = font.id;
                if (font.id === settings.font) btn.classList.add('active');
                btn.innerHTML =
                    `${font.name}<span class="font-sample" style="font-family:${font.css};">${font.sample}</span>`;
                btn.addEventListener('click', () => {
                    applyFont(font.id);
                    showToast(`字体切换为 “${font.name}”`);
                });
                fontContainer.appendChild(btn);
            });

            updateCustomBgUI();
        }

        function updateCustomBgUI() {
            const settings = loadSettings();
            const preview = document.getElementById('customBgPreview');
            const removeBtn = document.getElementById('removeBgBtn');
            if (settings.customBackground && settings.customBackground.length > 100) {
                preview.src = settings.customBackground;
                preview.classList.add('show');
                removeBtn.style.display = 'inline-block';
            } else {
                preview.classList.remove('show');
                removeBtn.style.display = 'none';
            }
        }

        const customBgInput = document.getElementById('customBgInput');
        document.getElementById('chooseBgBtn').addEventListener('click', () => customBgInput.click());
        customBgInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                showToast('图片过大，请选择小于 10MB 的图片');
                customBgInput.value = '';
                return;
            }
            try {
                const compressed = await compressImage(file, 1200, 0.7);
                applyCustomBackground(compressed);
                customBgInput.value = '';
            } catch (err) {
                showToast('图片处理失败，请重试');
                customBgInput.value = '';
            }
        });
        document.getElementById('removeBgBtn').addEventListener('click', clearCustomBackground);

        // ============================================================
        //  14. 存储管理
        // ============================================================

        function updateStorageInfo() {
            const size = getStorageSize();
            const records = loadRecords();
            const recordCount = records.length;
            const maxSize = 5 * 1024 * 1024;
            const percent = Math.min((size / maxSize) * 100, 100);

            document.getElementById('storageText').textContent =
                `已用 ${formatBytes(size)} · 共 ${recordCount} 条记录 ${size > maxSize ? ' ⚠️ 接近上限' : ''}`;
            document.getElementById('storageFill').style.width = percent + '%';
        }

        document.getElementById('exportDataBtn').addEventListener('click', () => {
            const records = loadRecords();
            const settings = loadSettings();
            const data = { records, settings, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `i人日记_备份_${getToday()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ 数据已导出');
        });

        document.getElementById('importDataBtn').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });

        document.getElementById('importFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.records && Array.isArray(data.records)) {
                        if (confirm(`将导入 ${data.records.length} 条记录，是否覆盖当前数据？`)) {
                            const records = data.records.map(r => {
                                if (r.image && !r.images) { r.images = [r.image];
                                    delete r.image; }
                                if (!r.images) r.images = [];
                                return r;
                            });
                            saveRecords(records);
                            if (data.settings) {
                                saveSettings(data.settings);
                                applyBackground(data.settings);
                                applyFont(data.settings.font || 'system');
                            }
                            currentFilterDate = getToday();
                            updateAll();
                            updateStorageInfo();
                            localStorage.removeItem('has_shown_restore_tip');
                            showToast('✅ 数据导入成功');
                        }
                    } else {
                        showToast('❌ 无效的备份文件');
                    }
                } catch (err) {
                    showToast('❌ 文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.getElementById('clearOldBtn').addEventListener('click', () => {
            const records = loadRecords();
            if (records.length === 0) { showToast('没有记录可清理'); return; }
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const cutoff = thirtyDaysAgo.toISOString().slice(0, 10);
            const toKeep = records.filter(r => r.date >= cutoff);
            const toRemove = records.length - toKeep.length;
            if (toRemove === 0) { showToast('没有超过30天的旧记录'); return; }
            if (confirm(`将删除 ${toRemove} 条 30 天前的记录，确定吗？`)) {
                saveRecords(toKeep);
                currentFilterDate = getToday();
                updateAll();
                updateStorageInfo();
                showToast(`✅ 已清理 ${toRemove} 条旧记录`);
            }
        });

        // ============================================================
        //  15. 日期导航
        // ============================================================

        document.getElementById('prevDayBtn').addEventListener('click', goToPrevDay);
        document.getElementById('nextDayBtn').addEventListener('click', goToNextDay);

        document.getElementById('clearFilterBtn').addEventListener('click', () => {
            if (currentFilterDate) {
                currentFilterDate = '';
                updateAll();
                showToast('显示全部记录 📖');
            } else {
                showToast('已经是全部记录啦');
            }
        });

        document.getElementById('navDateDisplay').addEventListener('click', openCalendar);

        // ============================================================
        //  16. 清空所有
        // ============================================================

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            const records = loadRecords();
            if (records.length === 0) { showToast('还没有记录呢 🌱'); return; }
            if (confirm('确定要清空所有记录吗？此操作不可撤销！')) {
                clearAllRecords();
                currentFilterDate = getToday();
                updateAll();
                showToast('已清空所有记录 🍃');
            }
        });

        // ============================================================
        //  17. 事件委托：图片点击放大（记录列表 & 查看模态框）
        // ============================================================

        document.getElementById('recordsList').addEventListener('click', function(e) {
            const target = e.target.closest('.grid-item');
            if (!target) return;
            e.stopPropagation();

            const grid = target.closest('.record-images-grid');
            if (!grid) return;
            const recordId = grid.dataset.recordId;
            if (!recordId) return;

            const record = getRecordById(recordId);
            if (!record || !record.images) return;
            const images = record.images.filter(img => img && img.length > 100);
            if (images.length === 0) return;

            const imgEl = target.querySelector('img');
            const src = imgEl ? imgEl.src : images[0];
            const idx = images.indexOf(src);
            openImagePreview(src, images, idx !== -1 ? idx : 0);
        });

        document.getElementById('viewContent').addEventListener('click', function(e) {
            const target = e.target.closest('.grid-item');
            if (!target) return;
            e.stopPropagation();

            if (!viewingRecordId) return;
            const record = getRecordById(viewingRecordId);
            if (!record || !record.images) return;
            const images = record.images.filter(img => img && img.length > 100);
            if (images.length === 0) return;

            const imgEl = target.querySelector('img');
            const src = imgEl ? imgEl.src : images[0];
            const idx = images.indexOf(src);
            openImagePreview(src, images, idx !== -1 ? idx : 0);
        });

        // ============================================================
        //  18. 初始化
        // ============================================================

        function init() {
            const settings = loadSettings();
            applyBackground(settings);
            applyFont(settings.font);

            renderMoodSelector();
            renderWeatherSelector();

            const records = loadRecords();
            if (records.length === 0) {
                const hasShownRestoreTip = localStorage.getItem('has_shown_restore_tip');
                if (!hasShownRestoreTip) {
                    setTimeout(() => {
                        if (confirm('📥 检测到新安装或数据为空，是否立即从备份文件恢复记录？\n\n（如果这是首次使用，请点击“取消”）')) {
                            document.getElementById('importFileInput').click();
                        }
                        localStorage.setItem('has_shown_restore_tip', 'true');
                    }, 500);
                }
            }

            currentFilterDate = getToday();
            updateAll();

            fabBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (modalOverlay.classList.contains('active')) {
                    handleClose();
                } else {
                    openModal();
                    if (!modalOverlay.classList.contains('active')) {
                        modalOverlay.classList.add('active');
                        fabBtn.classList.add('open');
                        document.body.style.overflow = 'hidden';
                    }
                }
            });

            setInterval(() => {
                const today = getToday();
                if (!currentFilterDate || isToday(currentFilterDate)) {
                    renderSlideCard();
                }
            }, 60000);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    const today = getToday();
                    if (!currentFilterDate || isToday(currentFilterDate)) {
                        renderSlideCard();
                    }
                }
            });

            console.log('✦ i人日记 v6.5 (PDF图片比例修复) 启动 ✦');
            console.log(`📖 共 ${loadRecords().length} 条记录`);
            console.log(`💾 存储用量: ${formatBytes(getStorageSize())}`);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
