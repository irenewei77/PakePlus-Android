<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代县帮扶政策工具箱</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background-color:#F5F7FA;display:flex;justify-content:center;padding:12px 0 30px;min-height:100vh}
    #app{max-width:420px;width:100%;background:#F5F7FA;border-radius:28px 28px 0 0;box-shadow:0 8px 24px rgba(0,0,0,0.05);overflow:hidden;min-height:90vh;padding:16px 16px 20px;position:relative}
    .page{display:none;animation:fadeIn .25s ease}.page.active{display:block}
    @keyframes fadeIn{0%{opacity:.6;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
    .search-box{background:#fff;border-radius:40px;padding:4px 18px;margin-bottom:20px;border:1px solid #E9EDF4;display:flex;align-items:center;box-shadow:0 2px 8px rgba(26,92,255,.06)}
    .search-box input{border:none;outline:none;background:transparent;width:100%;height:44px;font-size:16px;color:#1F2A3A}
    .search-box input::placeholder{color:#A8B5C8}
    .search-box .icon{margin-right:8px;font-size:18px}
    .category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
    .category-card{background:#fff;border-radius:16px;padding:20px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid #EEF2F8;transition:all .2s;cursor:pointer}
    .category-card:active{transform:scale(.96);background:#FAFCFF}
    .category-card .emoji{font-size:32px;display:block;margin-bottom:8px}
    .category-card .name{font-size:16px;font-weight:600;color:#0A1E3C}
    .category-card .count{font-size:13px;color:#7D8B9F;margin-top:4px}
    .back-btn{display:inline-flex;align-items:center;gap:6px;color:#1A5CFF;font-size:15px;font-weight:500;background:#fff;padding:6px 16px 6px 12px;border-radius:40px;border:1px solid #E9EDF4;cursor:pointer;margin-bottom:18px;transition:.2s}
    .back-btn:active{background:#F0F4FF}
    .page-title{font-size:20px;font-weight:700;color:#0A1E3C;margin-bottom:16px;padding-left:4px}
    .policy-name-list{display:flex;flex-direction:column;gap:10px}
    .policy-name-item{background:#fff;border-radius:12px;padding:14px 18px;border-left:4px solid #1A5CFF;box-shadow:0 1px 4px rgba(0,0,0,.03);border:1px solid #EEF2F8;border-left-width:5px;cursor:pointer;transition:.2s}
    .policy-name-item:active{background:#FAFCFF;transform:scale(.99)}
    .policy-name-item .pname{font-size:16px;font-weight:600;color:#1F2A3A}
    .detail-header{background:#fff;padding:18px 20px;border-radius:20px;margin-bottom:18px;border:1px solid #EEF2F8}
    .detail-header .p-name{font-size:22px;font-weight:700;color:#0A1E3C;display:block;margin-bottom:8px}
    .detail-header .p-cat{display:inline-block;background:#EFF4FF;color:#1A5CFF;font-size:13px;font-weight:600;padding:4px 16px;border-radius:40px}
    .info-block{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px;border:1px solid #EEF2F8}
    .info-row{display:flex;padding:8px 0;border-bottom:1px solid #F2F5FA}
    .info-row:last-child{border-bottom:none}
    .info-row .label{width:80px;flex-shrink:0;font-size:14px;color:#6A7A8E;font-weight:500}
    .info-row .value{font-size:15px;color:#1F2A3A;font-weight:500;flex:1}
    .content-block,.process-block{background:#fff;border-radius:16px;padding:18px 18px 16px;margin-bottom:16px;border:1px solid #EEF2F8}
    .block-title{font-size:16px;font-weight:600;color:#0A1E3C;display:block;margin-bottom:12px}
    .block-text{font-size:15px;line-height:1.7;color:#2C3D52;white-space:pre-wrap}
    .step{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;position:relative}
    .step:last-child{margin-bottom:0}
    .step:not(:last-child)::after{content:'';position:absolute;left:14px;top:28px;width:2px;height:calc(100% - 8px);background:#DCE3EC}
    .step-num{width:28px;height:28px;background:#1A5CFF;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;margin-top:2px;z-index:2}
    .step-text{font-size:15px;line-height:1.6;color:#1F2A3A;flex:1}
    .footer-fixed{background:#fff;padding:12px 0 0;border-radius:24px 24px 0 0;margin-top:20px;border-top:1px solid #EDF2F7;position:sticky;bottom:0}
    .call-btn{width:100%;background:#1A5CFF;color:#fff;border:none;border-radius:60px;padding:14px 0;font-size:17px;font-weight:600;box-shadow:0 6px 20px rgba(26,92,255,.3);cursor:pointer;transition:.2s}
    .call-btn:active{transform:scale(.97);background:#0A4AD0}
    .empty-tip{text-align:center;padding:40px 20px;color:#9AABBF;font-size:16px}
  </style>
</head>
<body>
<div id="app">
  <div id="page-categories" class="page active">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索政策名称..." oninput="handleSearch(this.value)">
    </div>
    <div class="category-grid" id="categoryGrid"></div>
  </div>
  <div id="page-policy-list" class="page">
    <div class="back-btn" onclick="goToCategories()">‹ 返回分类</div>
    <div class="page-title" id="policyListTitle">政策列表</div>
    <div class="policy-name-list" id="policyNameList"></div>
  </div>
  <div id="page-detail" class="page">
    <div class="back-btn" onclick="goToPolicyList()">‹ 返回政策列表</div>
    <div id="detailContainer"></div>
    <div class="footer-fixed">
      <button class="call-btn" id="callBtn" onclick="makeCall()">📞 联系负责人</button>
    </div>
  </div>
</div>
<script>
const policyData = [
  // 教育帮扶类 1-11
  {id:1,category:"教育帮扶类",name:"学前教育资助",target:"在教育行政部门审批设立的各级各类幼儿园就读并建有学籍的家庭经济困难儿童、孤儿和残疾儿童，具体包括：重点优抚对象，城乡低保家庭儿童，儿童福利机构孤儿及社会散居孤儿，父母双残或单残、家庭主要成员长期患病或丧失劳动能力造成生活困难的幼儿以及残疾幼儿；因重大自然灾害或其他突发事件造成家庭经济困难的幼儿。",content:"按照1000元/生/年的标准给予生活补助，分春、秋两次发放于学生监护人银行卡账户。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:2,category:"教育帮扶类",name:"义务教育“一补”资助",target:"在义务教育阶段学校就读并建有学籍的脱贫家庭学生、脱贫不稳定家庭学生、边缘易致贫家庭学生、突发严重困难家庭学生、家庭经济困难的城乡低保学生、低保边缘人口、特困救助学生、支出型困难家庭学生、其他低收入家庭学生、孤儿学生、事实无人抚养儿童、残疾学生、残疾人子女学生，从2019年秋季学期起，将义务教育阶段建档立卡学生，以及非建档立卡的家庭经济困难残疾学生、农村低保家庭学生、农村特困救助供养学生等四类家庭经济困难非寄宿生纳入生活补助范围，按照寄宿生生活补助国家标准的50%核定。",content:"在校寄宿生小学1250元/生/年，初中1500元/生/年；\n小学非寄宿生625元/生/年，初中750元/生/年；\n分春、秋两次发放于学生监护人银行卡账户。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:3,category:"教育帮扶类",name:"普通高中免学费",target:"具有正式学籍的普通高中在校生中的原建档立卡等家庭经济困难学生（含非建档立卡的家庭经济困难残疾学生、农村低保家庭学生、农村特困救助供养学生）。",content:"代县公办学校按照每生每年800元的标准免除学杂费（不含住宿费）。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:4,category:"教育帮扶类",name:"普通高中助学金",target:"具有正式学籍的普通高中在校生中的家庭经济困难学生。其中对建档立卡家庭经济困难学生以及非建档立卡的家庭经济困难残疾学生、农村低保家庭学生和农村特困救助供养学生实行应助尽助。",content:"从2025年春季学期起，将普通高中国家助学金平均资助标准由2000元/年/生提高到2300元/年/生，学校可结合实际在1200--3500元范围内确定，分2--3档。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:5,category:"教育帮扶类",name:"中职教育免学费",target:"对中等职业学校全日制学历教育正式学籍在校生免除学费。",content:"职业高中按照每生每年2000元的标准免除学费。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:6,category:"教育帮扶类",name:"中职教育助学金",target:"资助中等职业学校全日制学历教育正式学籍一、二、三年级在校涉农专业学生和非涉农专业家庭经济困难学生，包括脱贫家庭学生、脱贫不稳定家庭学生、边缘易致贫家庭学生、突发严重困难家庭学生、家庭经济困难的城乡低保学生、低保边缘人口、特困救助学生、支出型困难家庭学生、其他低收入家庭学生、孤儿学生、事实无人抚养儿童、残疾学生、残疾人子女学生，困难学生比例按照在校生15%确定。",content:"从2025年春季学期起，将中等职业学校（含技工院校）全日制学历教育正式学籍三年级在校涉农专业学生和非涉农专业家庭经济困难学生纳入国家助学金范围，平均资助标准由2000元/年/生提高到2300元/年/生，可结合实际在1200--3500元范围内确定，可分2--3档。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:7,category:"教育帮扶类",name:"“滋蕙计划”资助",target:"资助对象是普通高中及中等职业学校应届毕业生通过高考、高职单招考入全日制普通高等院校（含高职）的家庭经济困难且具有代县户籍的新生，优先资助脱贫不稳定家庭学生、边缘易致贫家庭学生、享受最低生活保障家庭学生、特困供养学生、孤残学生、烈士子女、残疾人子女。",content:"资助标准为考入山西省内院校的新生每人500元，考入山西省外院校的新生每人1000元的交通补助。",department:"县教育体育局",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"马磊峰",phone:"0350-8982345"},
  {id:8,category:"教育帮扶类",name:"代县雁门教育发展基金会资助",target:"资助代县籍当年公办本科院校（艺术类除外）录取的贫困家庭大学生资助代县籍品学兼优，家庭特别困难的在校高中生。",content:"具体资助金额由代县雁门教育发展基金会通过实地走访、个别访谈、学校了解等方式，根据学生家庭困难情况分档进行资助。",department:"山西代县雁门教育发展基金会",process:"学生申请--学校认定--学校公示--县级汇总--直补到生",contact:"王慧峰",phone:"13803445039"},
  {id:9,category:"教育帮扶类",name:"大学生生源地信用助学贷款",target:"具有中华人民共和国国籍，诚实守信、遵纪守法，家庭经济困难，学生本人入学前户籍与其共同借款人户籍均在本县（市、区），被国家批准设立、实施全日制高等学历教育的普通本科高校、高等职业学校和高等专科学校（含民办高校和独立学院，学校名单以教育部公布的为准）正式录取，取得真实、合法、有效录取通知书的全日制新生或高校在读的本专科学生、研究生和第二学士的学生。",content:"①助学贷款额度：自2024年秋季学期起，全日制普通本专科学生（含预科、高职、第二学士学位）每人每年申请贷款额度由不超过16000元提高至不超过20000元；全日制研究生（含硕士研究生、博士研究生）每人每年申请贷款额度由不超过20000元提高至不超过25000元。\n②助学贷款利率：国家助学贷款利率由同期档次贷款市场报价利率（LPR）减60个基点，调整为同期同档次LPR减70个基点。\n③助学贷款承办单位：忻州地区首贷承办银行变更为中国邮储银行，续贷承办银行继续由国家开发银行办理。\n④助学贷款用途：优先用于支付在校期间学费和住宿费，超出部分可以用于弥补日常生活费用。学生应该根据家庭经济困难情况确定申贷额度。",department:"县教育体育局",process:"2025年开始，忻州地区学生国家助学贷款业务全部由中国邮政储蓄银行山西省分行承担，学生可通过微信小程序“华安助学”进行网上操作办理。",contact:"马磊峰",phone:"0350-8982345"},
  {id:10,category:"教育帮扶类",name:"扶残助学圆梦工程",target:"（一）残疾人大学生。具有代县户籍，持有有效的《中华人民共和国残疾人证》，通过参加普通高考、单考单招、对口升学或保送录取，就读于全日制特殊教育高等院校、普通高等院校的在校残疾人大学生（包括大专生、本科生）。\n（二）困难残疾人家庭子女大学生。具有代县户籍、通过参加普通高考或保送录取，就读于全日制普通高等院校的在校困难残疾人家庭子女大学生（包括大专生、本科生）。\n（三）硕士研究生。具有代县户籍，参加国家统招或保送录取，就读于全日制普通高等院校、全日制特殊教育高等院校的在校残疾人硕士研究生和困难残疾人家庭子女硕士研究生。\n其中：代县户籍指参加普通高考、单考单招、对口升学、保送录取或国家统招时的户籍为代县户籍（被学校录取后户口迁出的不影响资助）。困难残疾人家庭子女大学生的户籍，须与父（母）亲或监护人在同一户籍上，如不在同一户籍上，需提供相关家庭关系证明材料。对资助对象户籍有疑义的，可与同级公安部门进行核实。困难残疾人家庭是指申请资助大学生的父（母）亲或监护人，持有有效的残疾人证，且在市级残联审批时，为“低保信息系统”内在保的低保对象或者认定的低保边缘家庭成员。",content:"不纳入资助范围对象：\n（一）已享受免交学费的在校残疾人大学生和困难残疾人家庭子女大学生。\n（二）参加成人教育的残疾人大学生和困难残疾人家庭子女大学生。\n（三）同一年度已享受过政府其他学费性（不含奖学金）优惠政策的在校残疾人大学生和困难残疾人家庭子女大学生。\n资助标准：\n大专生每人每年4000元，本科生每人每年5000元，硕士研究生每人每年6000元。\n资助年限：\n为确保资助公平公正，鉴于有休学、病休、延迟毕业等情况，资助时限统一确定为：大专期间最多资助3年，大学本科期间最多资助4年，硕士研究生期间最多资助2年（包括“十四五”期间资助年限）。",department:"县残联",process:"个人申请--乡镇审批--县级审核--市级复审--资金拨付",contact:"董丽华",phone:"13835032781"},
  {id:11,category:"教育帮扶类",name:"雨露计划资助",target:"防止返贫致贫对象家庭和需继续帮扶的原建档立卡脱贫家庭子女。",content:"就读中职、高职(专)、技工学校(含普通中专、职业高中、技工学校、普通大专、高职院校、技师学院等)在校学生(包含在校期间顶岗实习)，按学制每生每年给予3000元补助。",department:"县农业农村局",process:"导出名单--县级初审--乡级复审--公示公告--资金拨付",contact:"魏雅玲",phone:"0350-5222526"},
  // 健康帮扶类 12-26
  {id:12,category:"健康帮扶类",name:"持续优化疾病专项救治",target:"农业农村部门认定的防止返贫致贫对象、需要继续帮扶的原建档立卡脱贫人口和农村低收入人口当中罹患37种大病的人员。",content:"已纳入大病专项救治范围的37种病种（代县确定了19种），定点医院原则上保持不变。按照“定定点医院、定诊疗方案、加强质量安全管理”的原则，进一步加强临床路径和医疗质量管理，合理控制医疗费用，降低群众就医负担。",department:"县卫健局",process:"患者在县域内定点医疗机构就诊，经确诊属于37种大病范围----定点医疗机构将其纳入专项救治管理并建立台账----按照既定临床路径实施救治----医疗机构定期随访并做好救治信息登记与报送。",contact:"张学英",phone:"0350-5232188"},
  {id:13,category:"健康帮扶类",name:"住院“先诊疗后付费”制度",target:"全面落实低保对象、特困人员和防止返贫致贫对象在县域内定点机构住院“先诊疗后付费”政策。",content:"患者入院时不需要缴纳住院押金，只需在出院时支付医保报销后的自付医疗费用。",department:"县卫健局",process:"患者持有效身份证件、医保卡等材料到医疗机构就诊----医疗机构通过系统核对或人工审核确认身份----办理住院手续免收押金----出院时，患者结清医保报销后个人自付的费用，医保报销部分由医疗机构与医保部门结算。",contact:"张学英",phone:"0350-5232188"},
  {id:14,category:"健康帮扶类",name:"“家庭医生签约”服务",target:"县域内常住居民",content:"依托“1+1+X（1+X）”模式，引导和支持二级医院全科医生和城市医院下沉医生到基层医疗卫生机构开展签约服务。加强签约服务进展情况监测，做好家庭医生签约服务信息统计报送，积极推进签约服务费政策落实。",department:"县卫健局",process:"辖区常住居民到所在乡镇卫生院或村卫生室提出签约意向----家庭医生团队向居民介绍服务内容并双方自愿选择----签订《家庭医生签约服务协议书》----建立签约关系并开始提供约定服务。",contact:"白彩霞",phone:"18835061332"},
  {id:15,category:"健康帮扶类",name:"慢性病诊疗",target:"患有高血压、糖尿病、慢阻肺、严重精神障碍疾病患者。",content:"县医疗集团、各乡镇卫生院依托基本公共卫生服务项目，积极为慢病重点人群提供疾病筛查、健康体检、季度随访、干预等健康服务，对辖区内慢性病的患者，逐一提出健康指导意见并发放健康教育处方。",department:"县卫健局",process:"2026年慢特病报销全国统一标准、统一流程，实行“定点就医、直接结算、异地联网”，买药复查直接刷医保卡，自付部分当场结清 。",contact:"白彩霞",phone:"18835061332"},
  {id:16,category:"健康帮扶类",name:"参保缴费资助",target:"防止返贫致贫对象参加城乡居民基本医保个人缴费部分享受定额资助政策。\n从2022年起，特困人员、孤儿、低保对象参加城乡居民基本医保个人缴费部分享受参保分类资助政策。",content:"特困人员：个人缴费部分享受全额资助，个人无需缴纳参保费用。\n低保对象：按个人缴费标准的80%给予资助，个人仅需承担剩余的20%。\n防止返贫致贫对象：按每人每年280元的标准给予定额资助，个人缴纳剩余部分（具体金额按当年缴费标准减去280元计算）。",department:"县医保局",process:"根据系统标注情况，在缴费时自动减免相应参保费用。",contact:"翟景秀",phone:"5263550"},
  {id:17,category:"健康帮扶类",name:"基本医保报销",target:"参加城乡居民基本医疗保险人群，享受住院基本医保报销政策。",content:"基本医保年度支付限额7万元，县域内政策范围内住院费用报销比例总体稳定在75%左右。",department:"县医保局",process:"一站式结算",contact:"翟景秀",phone:"5263550"},
  {id:18,category:"健康帮扶类",name:"大病保险报销",target:"参加城乡居民基本医疗保险人群，达到大病保险报销起付线的享受大病保险报销政策。",content:"特困人员、低保对象和返贫致贫人口大病保险起付线降低50%，报销比例提高5个百分点，年度最高支付限额为60万元。",department:"县医保局",process:"一站式结算",contact:"翟景秀",phone:"5263550"},
  {id:19,category:"健康帮扶类",name:"医疗救助托底",target:"参加城乡居民基本医疗保险人群，享受医疗救助托底政策。",content:"特困人员目录内个人自付住院医疗费用由医疗救助给予保障。\n低保对象目录内个人自付住院医疗费用，按70%的比例给予医疗救助，年度最高救助限额6万元。\n返贫致贫人口目录内个人自付住院医疗费用，按70%的比例给予医疗救助，省内住院单次目录内费用综合支付比例达不到90%的，救助到90%。\n防止返贫致贫对象本年度政策范围内个人自付住院医疗费用超过上年度全省居民人均可支配收入10%的部分，按70%的比例给予医疗救助，年度最高救助限额6万元。\n低保边缘家庭成员本年度政策范围内个人自付住院医疗费用超过上年度全省居民人均可支配收入10%的部分，按60%的比例给予医疗救助，年度最高救助限额为4万元。\n因病致贫重病患者起付标准为全省上年居民人均可支配收入的25%，按60%的比例给予医疗救助，年度最高救助限额为4万元。",department:"县医保局",process:"一站式结算\n\n（因病致贫重病患者：个人书面申请，民政部门认定，报医保部门审核）",contact:"翟景秀",phone:"5263550"},
  {id:20,category:"健康帮扶类",name:"倾斜救助政策",target:"对规范转诊且在省域内就医的救助对象，经三重制度综合保障后政策范围内个人负担仍然较重的，享受倾斜救助政策。",content:"低保对象、返贫致贫人口政策范围内个人负担住院费用超过全省上年居民人均可支配收入15%的，低保边缘家庭成员、防止返贫致贫对象政策范围内个人负担住院费用超过全省上年居民人均可支配收入25%的，因病致贫重病患者政策范围内个人负担住院费用超过全省上年居民人均可支配收入40%的，超额部分按50%的比例给予医疗救助，年度最高封顶线为6万元。",department:"县医保局",process:"一站式结算\n\n（因病致贫重病患者：个人书面申请，民政部门认定，报医保部门审核）",contact:"翟景秀",phone:"5263550"},
  {id:21,category:"健康帮扶类",name:"市域内“一站式”结算",target:"",content:"市域内基本医保、大病保险、医疗救助“一站式”结算。",department:"县医保局",process:"将低保对象、特困人员、返贫致贫人口、农业农村部门防止返贫致贫对象直接纳入“一站式”结算。",contact:"翟景秀",phone:"5263550"},
  {id:22,category:"健康帮扶类",name:"门诊慢特病报销",target:"将符合46种门诊慢特病范围的困难人群纳入保障范围，享受门诊慢特病报销政策。",content:"符合条件的参保居民，按规定享受46种门诊慢特病保障待遇，按病种分类设定支付限额，报销比例70%左右。\n符合条件的参保居民，按规定享受门诊特药保障待遇，报销比例60%。\n普通门诊统筹年度支付限额为300元。",department:"县医保局",process:"一站式结算",contact:"翟景秀",phone:"5263550"},
  {id:23,category:"健康帮扶类",name:"门诊医疗救助",target:"纳入全省统一的门诊慢特病病种保障范围的特困人员、低保对象和返贫致贫人口按比例享受门诊救助政策；符合享受门诊特药保障政策的特困人员、低保对象和返贫致贫人口，按比例享受门诊救助政策。",content:"门诊慢特病政策范围内费用经基本医保、大病保险按规定报销后，剩余部分：特困人员按门诊慢特病75%、门诊特药20%的比例予以救助。\n低保对象和返贫致贫人口按门诊慢特病55%、门诊特药10%的比例予以救助。",department:"县医保局",process:"一站式结算",contact:"翟景秀",phone:"5263550"},
  {id:24,category:"健康帮扶类",name:"中央专项彩票公益金支持低收入妇女“两癌”救助项目",target:"患有宫颈浸润癌 IIB 以上或乳腺浸润癌的低收入妇女。",content:"申报对象为民政部门低收入人口动态监测信息平台中认定的最低生活保障对象、特困人员、最低生活保障边缘家庭成员，且在二级及以上医疗机构确诊患有宫颈浸润癌 IIB 以上或乳腺浸润癌的低收入妇女。救助标准为每人一次性救助10000元人民币，已获得救助的患病妇女不得重复申报。",department:"县妇联",process:"个人申请--乡村汇总--县级审核－－省市复审－－全国妇联下拨资金－－资金拨付到户",contact:"魏慧萍",phone:"0350-5223179"},
  {id:25,category:"健康帮扶类",name:"“忻保障”",target:"对因“三保障”、因饮水安全、因灾、因意外事件出现大额支出，分情况进行阶梯式补偿。每年年底，需要继续帮扶的原建档立卡脱贫人口及防止返贫致贫对象在享受各项政策后，家庭人均纯收入仍低于省定防返贫监测标准指导线的，对差额进行补偿。",content:"因病：自付费用扣除0.6万元后，剩余部分按比例救助，户年救助金额不超过10万元。\n因学：以年支付合规收费扣除当年教育扶贫各项补贴合计0.8万元为防贫救助起付线，超过此线部分实行阶梯式救助。\n因住：危房改造以户自行承担费用1.4万元为防贫救助起付线，超出此线的实行阶梯式救助。户年救助金额不超过5万元。\n因意外事故：以因意外事故造成家庭人均收入与当年省定防返贫监测范围指导线缺口达1万元以上为防贫救助起付线，超出此线的，实行阶梯式救助。户一次性救助金额不超过3万元。\n收入不达监测范围：按照当年省定防返贫监测范围指导线对差额进行补偿。",department:"县农业农村局",process:"个人申请--村级初审--乡级审核--入户调查--部门协查--县级公示--发放救助",contact:"魏雅玲",phone:"0350-5222526"},
  {id:26,category:"健康帮扶类",name:"医保参保人员补充健康保险\n（晋惠保）",target:"截至2025年11月30日前纳入的监测对象。",content:"1.医保范围内住院医疗费用：保额150万，赔付比例：100%，跨省异地就医部分赔付比例：85%\n2.医保范围外住院医疗费用：保额150万，赔付比例：55%，跨省异地就医部分赔付比例：40%\n3.特药医疗费用（国内药31，海外药73）：保额150万，赔付比例：80%\n4.CAR--T疗法特药医疗费用（四种）：保额100万，赔付比例：80%\n5.猝死：3万元（60周岁以上人员保额为0）\n6.质子重离子医院住院医疗费用：保额100万，赔付比例：100%\n注意：前四项免赔额1.5万元（续保、两低一特家庭起付线1.3万元）后两项免赔额0万元",department:"中国人民财产保险股份有限公司代县支公司",process:"提供以下手续直接到保险公司办理：住院证、出院证、病历、用药清单、药费票、诊断建议书、结算单、身份证、银行卡。",contact:"郎晓蓉",phone:"15635008400"},
  // 住房安全保障 27
  {id:27,category:"住房安全保障",name:"危房改造补助",target:"对居住在经鉴定或评定确属C级、D级危险房屋的农村低收入群体6类重点对象（农村易返贫致贫户、低保户、分散供养特困人员、因病因灾因意外事故等刚性支出较大或收入大幅缩减导致基本生活出现严重困难家庭、农村低保边缘家庭、未享受过农村住房保障政策支持且依靠自身力量无法解决住房安全问题的其他需要继续帮扶的原建档立卡脱贫人口），给予危房改造补助。",content:"2026年标准暂未出台",department:"县住建局",process:"个人申请--村级评议--镇级审核--县级批准--竣工验收--拨付补助资金",contact:"李俊旺",phone:"13934441718"},
  // 产业帮扶类 28-45
  {id:28,category:"产业帮扶类",name:"耕地地力保护补贴",target:"对确权颁证到位的拥有耕地承包权的种地农民给予补贴。",content:"67元/亩",department:"县农业农村局",process:"村级登记造册--镇村审核公示--县级公示--直补到户",contact:"程建文",phone:"13620605001"},
  {id:29,category:"产业帮扶类",name:"农机购置补贴",target:"对全县购买属于补贴范围内农机具的农户进行农机购置补贴。",content:"按照《2024--2026年农机购置与应用补贴实施方案》标准进行补贴。",department:"县农业农村局",process:"申请录入--资料审核--机具核验--公示--结算",contact:"程建文",phone:"13620605001"},
  {id:30,category:"产业帮扶类",name:"农机报废更新补贴",target:"依据山西省农业农村厅、山西省发改委、山西省财政厅、山西省商务厅关于印发《农业机械报废更新补贴实施方案》，对全县范围内符合报废标准并申请农机具报废及报废更新的农机户予以补贴。",content:"依据《农业机械报废补贴额一览表》《农业机械报废并更新提高标准后报废补贴额一览表》等规定标准进行补贴。",department:"县农业农村局",process:"申请录入--机具拆解--申请审核--公示--结算",contact:"程建文",phone:"13620605001"},
  {id:31,category:"产业帮扶类",name:"滴灌高效节水农业补贴",target:"对实施滴灌的经营主体（包括农户、合作社、家庭农场、企业）给予补贴。",content:"100元/亩",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:32,category:"产业帮扶类",name:"全生物降解地膜应用补贴",target:"对实施全生物降解地膜的经营主体（包括农户、合作社、家庭农场、企业）给予补贴。",content:"在享受上级政策补贴60元基础上，每亩增补60元。为激励农户积极性，2026年县级奖补每亩增补30元，即县级奖补每亩90元，合计共150元。（降解地膜执行标准：GB/T35795--2017）",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:33,category:"产业帮扶类",name:"黍米种植补贴",target:"对黍米种植主体（包括农户、合作社、家庭农场、企业）给予补贴（含中央省市补贴）；鼓励黄酒企业发展订单农业，推广“公司+基地+农户”的模式，建设1万亩优质黍米基地。",content:"1.黍米种植主体：500元/亩；\n2.优质黍米基地：550元/亩。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:34,category:"产业帮扶类",name:"大豆及大豆玉米带状复合种植补贴",target:"对单一种植大豆一亩以上的农户、家庭农场、合作社、企业给予补贴；对按照示范推广方案实施大豆玉米带状复合种植的农户、家庭农场、合作社、企业给予补贴。",content:"单一种植大豆的在享受上级政策补贴100元基础上，每亩增补100元；对大豆玉米带状复合种植的，给予每亩300元的补贴（含中央省市补贴）。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:35,category:"产业帮扶类",name:"油料种植补贴",target:"对单一种植油料作物一亩以上的种植主体（包括农户、家庭农场、合作社、企业）给予补贴。",content:"在享受上级政策补贴10元基础上，每亩增补200元。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:36,category:"产业帮扶类",name:"水稻种植补贴",target:"对水稻种植主体（包括农户、合作社、家庭农场、企业）给予补贴；支持每个乡镇建设1个连片300亩以上的水稻种植示范基地。",content:"1.新改造稻田给予每亩100元补贴；\n2.水稻种植田间管理给予每亩400元补贴；\n3.示范基地每个增补15万元。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:37,category:"产业帮扶类",name:"谷子种植补贴",target:"对谷子种植主体（包括农户、合作社、家庭农场、企业等）给予补贴。",content:"100元/亩",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:38,category:"产业帮扶类",name:"支持新型农业经营主体发展",target:"对首次认定的县级农业产业化龙头企业给予一次性奖补；对2026年评定的县级农民合作社示范社、县级示范家庭农场给予补助。",content:"1万元",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:39,category:"产业帮扶类",name:"支持农产品品牌建设",target:"新认定为“有机农产品”“绿色食品”的主体。",content:"对获得有机农产品、绿色食品续认证书的，每个续认产品给予5000元奖补。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:40,category:"产业帮扶类",name:"支持设施蔬菜日光温室越冬茬种植",target:"对本年度单个园区内日光温室种植越冬茬反季节蔬菜总面积达50亩以上的园区种植经营主体给予奖补。",content:"市级财政资金一次性奖补10万元。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:41,category:"产业帮扶类",name:"支持地域特色露地蔬菜种植",target:"对县域内露地种植的单品蔬菜面积达100亩－-500亩的种植经营主体给予奖补；对单个连片种植面积达到500亩以上的种植经营主体给予奖补。",content:"100亩－-500亩：市财政按200元/亩给予奖补；\n500亩以上：市级财政资金奖补15万元。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"程建文",phone:"13620605001"},
  {id:42,category:"产业帮扶类",name:"支持养殖经营主体贷款贴息",target:"对在我市政策性银行、商业银行（含农村信用合作社）贷款用于肉牛、奶牛、奶羊生产经营相关活动的经营主体给予贷款贴息。",content:"肉牛存栏量在50头以上，奶牛存栏量在100头以上，肉羊存栏量在200只以上；贷款时间为2026年1月1日--12月31日存续和新增贷款，市级财政资金按贷款年利率1%贴息。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"杨荣厚",phone:"13935083681"},
  {id:43,category:"产业帮扶类",name:"支持棚圈设施建设",target:"1.对新建年出栏达100头、圈舍1000平米以上的标准化育肥牛场给予补贴；\n2.对新建年出栏达1000只、圈舍1000平米以上的标准化育肥羊场给予补贴。",content:"1.对符合标准的育肥牛场实际财政资金给予每场15万元的圈舍建设补贴；2.对符合标准的育肥羊场给予每场10万元的圈舍建设补贴。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"李宏恩",phone:"18634636293"},
  {id:44,category:"产业帮扶类",name:"“见犊补母”奖补",target:"项目实施期内，对县域内基础母牛所产犊母牛给予补助，包括杂交新生犊母牛、良种冻精配种新生犊母牛或国家审定引种所产犊母牛，对没有生产母牛而新购犊母牛不计入补助范围。",content:"1.在项目实施期内，引进国内、外优良品种（包括人工配种）的新生犊母牛，每头一次性补贴不高于1500元；\n2.在项目实施期内，杂交所产的新生犊母牛，每头一次性补贴不高于1000元。",department:"县农业农村局",process:"村级摸底--乡镇核定公示--县级审核--直补到户",contact:"李宏恩",phone:"18634636293"},
  {id:45,category:"产业帮扶类",name:"“晋忻保”",target:"对需要继续帮扶的原建档立卡脱贫人口、防止返贫致贫对象种植的小杂粮、甜糯玉米、甘甜红薯、中药材、辣椒、红枣、梨、白水杏、葡萄、香瓜、食用菌等农作物，以及养殖的牛、羊、驴、鸡等畜禽，因自然灾害或价格波动造成损失，且年度收支测算低于当年省定监测范围时，给予救助。",content:"小杂粮1000元/亩、甜糯玉米600元/亩、甘甜红薯600元/亩、中药材1000元/亩、辣椒1000元/亩、红枣1000元/亩、梨1000元/亩、白水杏1000元/亩、葡萄1000元/亩、香瓜1000元/亩、食用菌4.5元/棒、牛5000元/头、羊500元/头、驴5000元/头、鸡15元/只。每户市场价格波动、自然灾害两项救助金额合计最高封顶20000元。",department:"县农业农村局",process:"建立台账--个户申请--实地勘测--部门核查--审核公示--实时保障",contact:"魏雅玲",phone:"0350-5222526"},
  // 金融帮扶类 46
  {id:46,category:"金融帮扶类",name:"小额信贷贴息",target:"对全县防止返贫致贫人口和需要继续帮扶的原建档立卡脱贫人口，用于产业发展的帮扶小额信贷进行贴息。",content:"贷款5万元（含）以下部分，中央财政常态化帮扶资金按贷款利率的70%贴息（上限不超过2.5个百分点），省级财政常态化帮扶资金按贷款利率的30%贴息（财政累计贴息上限不超过3.5个百分点），贷款利率超过贴息上限部分，由借款人自行承担；贷款5--10万元（含）部分，中央财政常态化帮扶资金按贷款利率的70%贴息（上限不超过2.5个百分点），剩余利息由借款人承担。",department:"县农业农村局",process:"银行申报--审核公示--资金拨付",contact:"魏雅玲",phone:"0350-5222526"},
  // 就业帮扶类 47-56
  {id:47,category:"就业帮扶类",name:"创业担保贷款",target:"法定劳动年龄内，个人信用记录良好的城镇登记失业人员、复员转业退役军人、高校毕业生、农村自主创业农民等十类个人创业人员以及符合条件的小微企业。",content:"符合条件的个人创业担保贷款额度最高不超过30万元，贷款期限不超过3年；小微企业创业担保贷款额度最高不超过400万元，贷款期限不超过2年。对符合条件的创业担保贷款财政部门给予贷款实际利率50%的财政贴息，对还款积极、带动就业能力强、创业项目好的借款个人或小微企业，创业担保贷款到期后可继续申请贷款和贴息支持，累计次数不超过3次。",department:"县人社局",process:"个人申请--资格核实--经办银行贷前审查--担保机构出具担保函--银行放款--贴息",contact:"赵加强",phone:"18735021593"},
  {id:48,category:"就业帮扶类",name:"一次性创业补贴",target:"毕业学年及毕业5年内高校毕业生、返乡入乡创业人员、就业困难人员，首次创办小微企业或从事个体经营且正常运营1年以上的。",content:"符合条件的高校毕业生根据带动就业人数给予最高2万元的一次性创业补贴，返乡入乡创业人员、就业困难人员根据带动就业人数给予最高5000元的一次性创业补贴。",department:"县人社局",process:"个人申请--县级审核--公示--资金拨付",contact:"赵加强",phone:"18735021593"},
  {id:49,category:"就业帮扶类",name:"场地租赁补贴",target:"毕业5年内回县创业的高校毕业生自主创业且正常经营6个月以上的，以及返乡入乡创业人员首次创办经营实体且正常运营1年以上的。",content:"符合条件的给予每年3000元创业场地租赁补贴，补贴期限最长三年",department:"县人社局",process:"个人申请--县级审核--公示--资金拨付",contact:"赵加强",phone:"18735021593"},
  {id:50,category:"就业帮扶类",name:"一次性吸纳就业补贴",target:"对就业帮扶车间吸纳防止返贫致贫对象务工就业的，参照小微企业落实一次性吸纳就业补助。",content:"年度（以12个月为起讫周期）内新吸纳城乡各类劳动者且稳定就业半年以上的小微企业。按每人1500元给予补贴。",department:"县人社局",process:"年度（以12个月为起讫周期）内新吸纳城乡各类劳动者且稳定就业半年以上的小微企业。按每人1500元给予补贴。",contact:"白建华",phone:"13111205533"},
  {id:51,category:"就业帮扶类",name:"职业技能培训",target:"落实“百行百业、人人出彩”技能提升行动适用对象：有就业和培训意向的脱贫劳动力、毕业年度高校毕业生、城乡未继续升学的应届初高中毕业生、农村转移就业劳动者、城镇登记失业人员、就业困难人员等各类就业重点群体。",content:"面向有就业和培训意向的脱贫劳动力、毕业年度高校毕业生、城乡未继续升学的应届初高中毕业生、农村转移就业劳动者、城镇登记失业人员、就业困难人员等各类就业重点群体，围绕康养托育、先进制造、现代服务、新职业等重点领域市场需求，推行“岗位需求+技能培训+技能评价+就业服务”四位一体项目化培训模式，推动培训和就业协同联动，促进劳动者实现高质量充分就业。",department:"县人社局",process:"参培人员报名--培训机构扫券--录入实名制系统--参加职业技能培训",contact:"王秉权",phone:"15834290423"},
  {id:52,category:"就业帮扶类",name:"帮扶残疾人自主就业创业",target:"1.具有代县农村户籍，年满16周岁（含）且不超过70周岁（含），持有效残疾人证且有较强的劳动能力、发展产业意愿的残疾人。\n2.具有代县农村户籍，年满16周岁（含）且不超过70周岁（含），有较强的劳动能力和发展产业意愿，重度残疾人及智力、精神残疾人（持有效残疾人证，年龄不限）的监护人或共同生活的直系亲属。\n3.对符合帮扶对象条件1或2的申请对象，要优先将产业发展初见成效、参加过相关技能培训、“十四五”期间未享受过助残帮扶项目扶持的农村残疾人家庭或低保户、低保边缘家庭、防返贫防止返贫致贫对象、原建档立卡贫困户及一户多残、以老养残等特殊困难的农村残疾人家庭纳入帮扶范围。一个家庭（依据居民户口簿判定）限一人享受该帮扶政策。",content:"乡镇残联、村民委员会（社区居委会）要结合本地发展实际和帮扶对象意愿，帮助选择1—2个既符合残疾人家庭发展条件又有较好销路的产业作为帮扶项目，协商签订《帮扶残疾人自主就业创业协议书》，并给予技术、信息和资金等方面的帮扶。\n帮扶标准为每名3000元。帮扶资金主要用于帮助农村残疾人家庭发展种植业、养殖业、手工业、加工业、小商铺、小作坊及旅游、休闲康养、电子商务等新产业。有条件的乡镇可自筹资金，加大帮扶力度，扩大帮扶对象范围，帮助更多的残疾人家庭实现稳定增收。",department:"县残联",process:"个人申请--村级初审--乡级审核--县级复审",contact:"董丽华",phone:"13835032781"},
  {id:53,category:"就业帮扶类",name:"光伏公益性岗位就业",target:"面向全体农户，优先吸纳需要继续帮扶的原建档立卡脱贫人口、防止返贫致贫对象。",content:"按照“按需设岗、以岗聘任、在岗领补、有序退岗”的原则，全省乡村光伏公益性岗位精简整合为电站管护员、乡村网格员、便民服务员、政策宣传员、保洁绿化员、养老护理员、信息统计员、资产维护员、安全管理员等“九大类”。岗位工资每月不低于300元。\n原则上每个村公岗数量控制在村里常住人口的 20%以内，优先吸纳需要继续帮扶的原建档立卡脱贫人口、防止返贫致贫对象实现就近就地就业。年龄超过65周岁的在岗人员，每年要安排进行身体健康体检，确保当前身体状况能够胜任岗位需求，体检费用从光伏收益中列支。",department:"县农业农村局",process:"公告--申报--审核--公示--聘用--培训--备案",contact:"魏雅玲",phone:"0350-5222526"},
  {id:54,category:"就业帮扶类",name:"光伏小型公益事业帮扶",target:"面向全体农户，优先吸纳需要继续帮扶的原建档立卡脱贫人口、防止返贫致贫对象。",content:"村级光伏帮扶电站收益可用于开展小型公益事业，如村内生产设施维护、人居环境整治、农村精神文明创建等。帮扶对象通过参与村级小型公益事业增加务工收入，工资按照“一事一议”原则发放。",department:"各行政村",process:"按照各村小型公益事业实施情况，吸纳帮扶对象就业。",contact:"各行政村",phone:"村主要负责人"},
  {id:55,category:"就业帮扶类",name:"一次性交通补贴",target:"对全县跨省务工和省内县外务工的防止返贫致贫人口和需要继续帮扶的原建档立卡脱贫人口（含外出灵活就业人员），发放一次性交通补贴。",content:"县外市内：100元/人/年；\n市外省内：300元/人/年；\n省外：①北京市、天津市、河北省、河南省、山西省、内蒙古自治区、宁夏回族自治区，500元/人/年。\n②其余省、自治区、直辖市、国外，1000元/人/年。",department:"县农业农村局",process:"个人申请--村级审核--乡镇审定--县级公示--发放补贴",contact:"魏雅玲",phone:"0350-5222526"},
  {id:56,category:"就业帮扶类",name:"生态护林员",target:"需要继续帮扶的原建档立卡脱贫人口；身体条件能够胜任野外巡护工作，能够在当地长期稳定从事管护工作。",content:"工资标准：每人每年6000元。",department:"县林业局",process:"乡镇公告--个人申请--村委会申报--乡镇审核--村委会公示--聘用--县林业局备案",contact:"张鹏飞",phone:"13935013777"},
  // 生态帮扶类 57
  {id:57,category:"生态帮扶类",name:"新一轮退耕还林延长期农户补助",target:"新一轮退耕还林农户。",content:"补贴标准：每亩每年补助100元。",department:"县林业局",process:"村申请--乡审核--县林业局发放",contact:"闫利军",phone:"13903504383"},
  // 兜底保障类 58-70
  {id:58,category:"兜底保障类",name:"低保救助",target:"共同生活的家庭成员人均收入低于当地最低生活保障标准，且符合财产状况规定的家庭。",content:"2026年农村低保标准：A类488.2元/月；B类436元/月；C类416元/月。",department:"县民政局",process:"个人申请－－入户调查--民主评议--审核公示--县级确认--发放救助",contact:"张泽亭",phone:"0350-5222650"},

let currentCategory='', searchKeyword='';
function showPage(id){document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById(id).scrollTop=0}
function goToCategories(){currentCategory='';searchKeyword='';document.getElementById('searchInput').value='';renderCategories();showPage('page-categories')}
function goToPolicyList(){if(currentCategory){renderPolicyNameList(currentCategory);showPage('page-policy-list')}else{goToCategories()}}
function renderCategories(){
  const grid=document.getElementById('categoryGrid');
  const countMap={};policyData.forEach(p=>{countMap[p.category]=(countMap[p.category]||0)+1});
  const cats=Object.keys(countMap);
  if(!cats.length){grid.innerHTML='<div class="empty-tip">暂无政策分类</div>';return}
  const emojiMap={'教育帮扶类':'📚','健康帮扶类':'🏥','住房安全保障':'🏠','产业帮扶类':'🌾','金融帮扶类':'💰','就业帮扶类':'💼','生态帮扶类':'🌳','兜底保障类':'🤝'};
  grid.innerHTML=cats.map(c=>`<div class="category-card" onclick="selectCategory('${c}')"><span class="emoji">${emojiMap[c]||'📋'}</span><div class="name">${c}</div><div class="count">${countMap[c]} 项政策</div></div>`).join('')
}
function selectCategory(cat){currentCategory=cat;document.getElementById('policyListTitle').textContent=`📌 ${cat}`;renderPolicyNameList(cat);showPage('page-policy-list')}
function renderPolicyNameList(category){
  const container=document.getElementById('policyNameList');
  let filtered=policyData.filter(p=>p.category===category);
  if(searchKeyword.trim()!==''&&category===''){const kw=searchKeyword.trim().toLowerCase();filtered=policyData.filter(p=>p.name.toLowerCase().includes(kw));document.getElementById('policyListTitle').textContent=`🔍 搜索结果（${filtered.length}）`}
  else{document.getElementById('policyListTitle').textContent=`📌 ${category}`}
  if(!filtered.length){container.innerHTML='<div class="empty-tip">📭 暂无政策</div>';return}
  container.innerHTML=filtered.map(p=>`<div class="policy-name-item" onclick="openDetail(${p.id})"><div class="pname">${p.name}</div></div>`).join('')
}
function openDetail(id){
  const item=policyData.find(p=>p.id===id);if(!item)return;
  const container=document.getElementById('detailContainer');
  const steps=item.process?item.process.split('\n').filter(s=>s.trim()!==''):[];
  let stepsHtml='';
  if(steps.length){stepsHtml=steps.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s.trim()}</div></div>`).join('')}
  else{stepsHtml=`<div class="block-text">${item.process||'暂无详细流程'}</div>`}
  container.innerHTML=`
    <div class="detail-header"><span class="p-name">${item.name}</span><span class="p-cat">${item.category}</span></div>
    <div class="info-block">
      <div class="info-row"><span class="label">适用对象</span><span class="value">${item.target||'—'}</span></div>
      <div class="info-row"><span class="label">实施部门</span><span class="value">${item.department||'—'}</span></div>
      <div class="info-row"><span class="label">联系人</span><span class="value">${item.contact||'—'}</span></div>
      <div class="info-row"><span class="label">咨询电话</span><span class="value">${item.phone||'—'}</span></div>
    </div>
    <div class="content-block"><span class="block-title">📄 政策内容</span><div class="block-text">${item.content||'—'}</div></div>
    <div class="process-block"><span class="block-title">📋 申领流程</span>${stepsHtml}</div>
  `;
  const btn=document.getElementById('callBtn');
  btn.innerHTML=`📞 联系负责人（${item.contact||'暂无'}）`;
  btn.dataset.phone=item.phone||'';
  showPage('page-detail')
}
function handleSearch(value){searchKeyword=value.trim();if(searchKeyword===''){if(document.getElementById('page-policy-list').classList.contains('active')){goToCategories()}else{renderCategories()}return}currentCategory='';document.getElementById('policyListTitle').textContent='🔍 搜索结果';renderPolicyNameList('');showPage('page-policy-list')}
function makeCall(){const phone=document.getElementById('callBtn').dataset.phone||'';if(phone){window.location.href=`tel:${phone}`}else{alert('暂无联系电话')}}
// 左右滑动返回
(function(){
  let startX=0,startY=0,isHorizontal=false;
  document.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.screenX;startY=t.screenY;isHorizontal=false},{passive:true});
  document.addEventListener('touchmove',e=>{const t=e.changedTouches[0];const dx=t.screenX-startX,dy=t.screenY-startY;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){isHorizontal=true;e.preventDefault()}},{passive:false});
  document.addEventListener('touchend',e=>{if(!isHorizontal)return;const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>50){const active=document.querySelector('.page.active');if(!active)return;const id=active.id;if(id==='page-detail')goToPolicyList();else if(id==='page-policy-list')goToCategories()}},{passive:true})
})();
renderCategories();showPage('page-categories');
</script>
